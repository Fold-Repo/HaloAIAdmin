name: Deploy

# develop → Netlify (configured in Netlify, not this workflow)
# main    → live server (same box as the API), https://admin.halloreels.com
#
# Copy the *_LIVE SSH secrets from the backend repo (same values).
# GHCR_TOKEN is also the same PAT (read:packages). The image name is this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI checks before deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-admin-production
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_LIVE || 'https://halloreels.com/api' }}

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [quality]
    if: |
      always() &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          TAG="${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_LIVE || 'https://halloreels.com/api' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to live server
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: needs.build-and-push.result == 'success'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_LIVE }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER_LIVE }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT_LIVE || 22 }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH_LIVE || '/var/www/ai-creator-admin' }}
      APP_PORT: ${{ vars.APP_PORT_LIVE || '7080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compose file
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          mkdir -p deploy-artifacts
          sed -e "s|IMAGE_PLACEHOLDER|${IMAGE}:${TAG}|g" \
            deploy/docker-compose.prod.yml > deploy-artifacts/docker-compose.yml

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_LIVE }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          script: mkdir -p "${{ env.DEPLOY_PATH }}"

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_LIVE }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          source: deploy-artifacts/docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_LIVE }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            APP_PORT="${{ env.APP_PORT }}"
            cd "$DEPLOY_PATH"

            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_TOKEN secret is empty."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "APP_PORT=${APP_PORT}" > .env
            elif ! grep -q '^APP_PORT=' .env 2>/dev/null; then
              echo "APP_PORT=${APP_PORT}" >> .env
            fi

            LOGIN_USER="${GHCR_USERNAME:-${{ github.actor }}}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$LOGIN_USER" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Waiting for admin on :${APP_PORT}..."
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
                echo "Admin deploy healthy."
                exit 0
              fi
              sleep 2
            done
            docker compose ps
            docker compose logs --tail=100 web
            exit 1
