# Host nginx → admin SPA on 127.0.0.1:7080
# https://admin.halloreels.com (Cloudflare Flexible / orange cloud)
#
# Install on the live server (same box as the API):
#   sudo tee /etc/nginx/sites-available/admin.halloreels.com
#   sudo ln -sf /etc/nginx/sites-available/admin.halloreels.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_x_forwarded_proto $admin_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.halloreels.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:7080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $admin_forwarded_proto;
    }
}
