# Static admin UI. Host nginx → 127.0.0.1:7080
# IMAGE_PLACEHOLDER is replaced by the deploy workflow.

services:
  web:
    image: IMAGE_PLACEHOLDER
    container_name: ai-creator-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-7080}:80'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
